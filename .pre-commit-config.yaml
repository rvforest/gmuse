default_language_version:
  node: 22.14.0

# Install both hook types with `pre-commit install`. The diff-coverage hook
# is pre-push only so it does not run on every commit.
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]
        pass_filenames: false # ruff is fast enough to check everything
      - id: format
        name: format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: types
        name: check types
        entry: uv run --frozen pyrefly check
        language: system
        types: [python]
        # Exclude docs module here; it is checked by a separate docs-specific hook.
        exclude: ^docs/_ext/
      - id: types-docs
        name: check docs types
        entry: uv run --frozen --group=docs pyrefly check docs/_ext
        language: system
        types: [python]
        # Only run this hook for files under the docs module.
        files: ^src/gmuse/_docs/.*\.py$
        # Run once for the docs tree rather than per-file.
        pass_filenames: false
      - id: diff-coverage
        name: diff coverage
        entry: uv run --frozen nox -s diff-coverage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^docs/source/_static/logo/
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.1
    hooks:
      - id: cspell # Spell check changed files
        name: check docs spelling
        # Only run cspell for the top-level README.md and all markdown files
        # under docs/. This avoids running it on unrelated .md files elsewhere.
        files: '^(README\.md|docs/.*\\.md)$'
        language_version: 26.13.1  # Active LTS; hook needs Node >=22.18.0

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.8
    hooks:
      - id: uv-lock

default_stages: [pre-commit, pre-push]
